# GEORGE: gerado por scripts/george-gen-workflow.py a partir de flutter-build.yml. Não edite à mão.
name: George probe build appnoif

on:
  workflow_call:
    inputs:
      upload-artifact:
        type: boolean
        default: true
      upload-tag:
        type: string
        default: "nightly"
      publish-update-metadata:
        type: boolean
        default: false
  workflow_dispatch:
    inputs:
      upload-artifact:
        type: boolean
        default: true
        description: "Gerar e subir artefatos"
      upload-tag:
        type: string
        default: "nightly"
        description: "Tag do release (vX.Y.Z publica release; outro valor só gera artefatos)"
      publish-update-metadata:
        type: boolean
        default: false

# NOTE: F-Droid builder script 'flutter/build_fdroid.sh' reads environment
# variables from this workflow!
#
# It does NOT read build steps, however, so please fix 'flutter/build_fdroid.sh
# whenever you add changes to Android CI build action ('build-rustdesk-android')
# in this file!

env:
  SCITER_RUST_VERSION: "1.75" # https://github.com/rustdesk/rustdesk/discussions/7503, also 1.78 has ABI change which causes our sciter version not working, https://blog.rust-lang.org/2024/03/30/i128-layout-update.html
  RUST_VERSION: "1.75" # sciter failed on m1 with 1.78 because of https://blog.rust-lang.org/2024/03/30/i128-layout-update.html
  MAC_RUST_VERSION: "1.81" # 1.81 is requred for macos, because of https://github.com/yury/cidre requires 1.81
  CARGO_NDK_VERSION: "3.1.2"
  SCITER_ARMV7_CMAKE_VERSION: "3.29.7"
  SCITER_NASM_DEBVERSION: "2.15.05-1"
  LLVM_VERSION: "15.0.6"
  FLUTTER_VERSION: "3.24.5"
  ANDROID_FLUTTER_VERSION: "3.24.5"
  # Windows arm64 only: the first stable Flutter to ship a native arm64 Windows Dart SDK +
  # engine is 3.44. Every other platform stays on FLUTTER_VERSION (3.24.5) until Windows 7
  # support is restored after the upstream-wide Flutter bump. The arm64 job patches the few
  # 3.44-only source/pubspec changes on the fly (see "Patch RustDesk sources for Flutter 3.44").
  FLUTTER_WINDOWS_ARM_VERSION: "3.44.9"
  # for arm64 linux because official Dart SDK does not work
  FLUTTER_ELINUX_VERSION: "3.16.9"
  TAG_NAME: "${{ inputs.upload-tag }}"
  # GEORGE: servidor/chave de produção embutidos em tempo de build (option_env! em src/george/mod.rs).
  RENDEZVOUS_SERVER: "georgedesk.com"
  RELAY_SERVER: "georgedesk.com:21117"
  API_SERVER: "https://georgedesk.com"
  RS_PUB_KEY: "GuScaZGLwh+xwwBVafvVItAJsbjNf+zT7tBEUWCIwqo="
  GEORGE_APP_NAME: "George"
  VCPKG_BINARY_SOURCES: "clear;x-gha,readwrite"
  # vcpkg version: 2026.07.29
  # If we change the `VCPKG COMMIT_ID`, please remember:
  # 1. Call `$VCPKG_ROOT/vcpkg x-update-baseline` to update the baseline in `vcpkg.json`.
  #  Or we may face build issue like 
  #  https://github.com/rustdesk/rustdesk/actions/runs/14414119794/job/40427970174
  # 2. Update the `VCPKG_COMMIT_ID` in `ci.yml` and `playground.yml`.
  VCPKG_COMMIT_ID: "9e593bb18ea69cc5095e012465dcd675a822ed0d"
  VCPKG_CMAKE_VERSION: "4.3.0"
  ARMV7_VCPKG_COMMIT_ID: "6f29f12e82a8293156836ad81cc9bf5af41fe836" # 2025.01.13, got "/opt/artifacts/vcpkg/vcpkg: No such file or directory" with latest version
  VERSION: "1.5.1"
  NDK_VERSION: "r28c"
  #signing keys env variable checks
  ANDROID_SIGNING_KEY: "${{ secrets.ANDROID_SIGNING_KEY }}"
  MACOS_P12_BASE64: "${{ secrets.MACOS_P12_BASE64 }}"
  UPLOAD_ARTIFACT: "${{ inputs.upload-artifact }}"
  PUBLISH_UPDATE_METADATA: "${{ inputs.publish-update-metadata }}"
  SIGN_BASE_URL: "${{ secrets.SIGN_BASE_URL }}-2"

jobs:
  build-george-web:
    name: George web (landing /web)
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout source code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - name: Package web landing
        shell: bash
        run: |
          # GEORGE: o web client completo depende do bridge JS v2 que o upstream não publica
          # (ver GEORGE-UPSTREAM.md). Publicamos a página /web com marca, que trata ?code= e
          # ?id=&pw= (abre george://connect e oferece os downloads).
          sed -i "s/__GEORGE_VERSION__/${{ env.VERSION }}/g" web-landing/index.html
          (cd web-landing && zip -r ../George-${{ env.VERSION }}-web.zip .)
          sha256sum George-${{ env.VERSION }}-web.zip
      - name: Upload George web artifact
        if: env.UPLOAD_ARTIFACT == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: George-${{ env.VERSION }}-web
          path: George-${{ env.VERSION }}-web.zip
          if-no-files-found: error
  build-appimage:
    name: George AppImage ${{ matrix.job.arch }}
    needs: [build-george-web]
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        job:
          - { target: x86_64-unknown-linux-gnu, arch: x86_64 }
    steps:
      - name: Checkout source code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          submodules: recursive

      - name: Download Binary
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: rustdesk-${{ env.VERSION }}-${{ matrix.job.arch }}.deb
          path: .

      - name: Rename Binary
        run: |
          mv rustdesk-${{ env.VERSION }}-${{ matrix.job.arch }}.deb appimage/rustdesk.deb

      - name: Build appimage package
        shell: bash
        run: |
          # install libarchive-tools for bsdtar command used in AppImageBuilder.yml
          sudo apt-get update -y
          # https://github.com/AppImage/AppImageKit/wiki/FUSE
          sudo apt-get install -y libarchive-tools libfuse2
          # set-up appimage-builder
          # https://github.com/AppImage/AppImageKit/issues/1395
          sudo pip3 install "setuptools_scm<10"
          sudo pip3 install git+https://github.com/rustdesk-org/appimage-builder.git
          # run appimage-builder
          pushd appimage
          ./build-apprun.sh ${{ matrix.job.arch }}
          sudo appimage-builder --skip-tests --recipe ./AppImageBuilder-${{ matrix.job.arch }}.yml
          cmp AppDir/AppRun appimage-build/AppRun/v2.0.0/AppRun-Release-${{ matrix.job.arch }}

      - name: Rename and upload George AppImage
        shell: bash
        run: |
          ls -la appimage/*.AppImage
          mv appimage/rustdesk-${{ env.VERSION }}-*.AppImage George-${{ env.VERSION }}-linux-${{ matrix.job.arch }}.AppImage
      - name: Upload George AppImage artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: George-${{ env.VERSION }}-linux-${{ matrix.job.arch }}-appimage
          path: George-${{ env.VERSION }}-linux-${{ matrix.job.arch }}.AppImage
          if-no-files-found: error
