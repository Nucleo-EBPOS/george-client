# GEORGE: CI de PR — compila Windows/macOS/Linux/web e sobe os artefatos (sem publicar release)
name: George CI

on:
  workflow_dispatch:
  pull_request:
    branches: [master]
    paths-ignore:
      - "docs/**"
      - "**.md"

permissions:
  contents: read

concurrency:
  group: george-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    uses: ./.github/workflows/george-build.yml
    secrets: inherit
    with:
      # artefatos são enviados (upload-artifact) para teste; o publish só roda com tag v*
      upload-artifact: true
      upload-tag: "ci"
