# GEORGE: CI de verificação (compila tudo, sem publicar) em PRs para master
name: George CI

on:
  workflow_dispatch:
  pull_request:
    branches: [master]
    paths-ignore:
      - "docs/**"
      - "**.md"

jobs:
  build:
    uses: ./.github/workflows/george-build.yml
    secrets: inherit
    with:
      upload-artifact: false
      upload-tag: "ci"
