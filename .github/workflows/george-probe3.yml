name: George probe 3
on:
  pull_request:
    branches: [master]
jobs:
  app:
    uses: ./.github/workflows/george-probe-build-app.yml
    secrets: inherit
    with:
      upload-artifact: false
      upload-tag: "ci"
  pub:
    uses: ./.github/workflows/george-probe-build-pub.yml
    secrets: inherit
    with:
      upload-artifact: false
      upload-tag: "ci"
  appif:
    uses: ./.github/workflows/george-probe-build-appif.yml
    secrets: inherit
    with:
      upload-artifact: false
      upload-tag: "ci"
