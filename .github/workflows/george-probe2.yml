name: George probe 2
on:
  pull_request:
    branches: [master]
jobs:
  bt:
    uses: ./.github/workflows/george-probe-build-bt.yml
    secrets: inherit
    with:
      upload-artifact: false
      upload-tag: "ci"
  win:
    uses: ./.github/workflows/george-probe-build-win.yml
    secrets: inherit
    with:
      upload-artifact: false
      upload-tag: "ci"
  mac:
    uses: ./.github/workflows/george-probe-build-mac.yml
    secrets: inherit
    with:
      upload-artifact: false
      upload-tag: "ci"
  linux:
    uses: ./.github/workflows/george-probe-build-linux.yml
    secrets: inherit
    with:
      upload-artifact: false
      upload-tag: "ci"
  web:
    uses: ./.github/workflows/george-probe-build-web.yml
    secrets: inherit
    with:
      upload-artifact: false
      upload-tag: "ci"
